# Keeps the pins in requirements-dev.txt and the actions in checks.yml current without
# anyone remembering to look. Mirrors the policy in the other repositories.

version: 2
updates:
  # One grouped PR a week keeps the noise down; majors still come in alone,
  # since the repo's rule is that they need a compatibility check first.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # checks.yml pins actions/checkout, actions/setup-python and actions/upload-artifact;
  # this is what notices when those majors move.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
